[project]
name = "collab-docs-server"
version = "0.2.0"
description = "FastAPI backend for the collaborative document editor core application."
requires-python = ">=3.12"
dependencies = [
  "diff-match-patch>=20241021",
  "email-validator>=2.2.0",
  "fastapi>=0.115.6",
  "pwdlib[bcrypt]>=0.2.1",
  "pydantic-settings>=2.6.1",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.19",
  "uvicorn[standard]>=0.32.1"
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
]

[tool.uv]
package = false
